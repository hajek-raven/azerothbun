services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
    command: ["--max-allowed-packet=1G", "--innodb-buffer-pool-size=1G", "--skip-name-resolve", "--mysql-native-password=ON"]
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/create_mysql.sql:/docker-entrypoint-initdb.d/create_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uacore", "-pacore"]
      interval: 2s
      retries: 60

volumes:
  mysql:
